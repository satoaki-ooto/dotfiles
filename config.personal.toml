[tools]
bun = "latest"
go = "latest"
pnpm = "latest"
sops = "latest"
uv = "latest"
zig = "latest"
zls = "latest"

[settings]
paranoid = true
minimum_release_age = "3d"
disable_tools = ["python", "python3"]
experimental = false
npm.package_manager = "bun"

[env]
UV_SYSTEM_CERTS = "true"
OPENSPEC_TELEMETRY = "0"
PATH = "${HOME}/go/bin:{{env.PATH}}"

[tools.node]
version = "lts"
#minimum_release_age = "0d"

[tools.pi]
version = "1.4.0"
minimum_release_age = "0d"

# github repositories

[tools."github:can1357/oh-my-pi"]
version = "18.14.1"
asset_pattern = 'omp-{{ os(macos="darwin") }}-{{ arch() }}'
bin = "omp"

[tools."github:MichaelKinsy/PiG"]
version = "0.5.3"
asset_pattern = 'pig-{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}.tar.gz'

[tools."github:nolabs-ai/nono"]
version = "0.81.0"
asset_pattern = 'nono-v{{ version }}-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(macos="apple-darwin", linux="unknown-linux-gnu") }}.tar.gz'

[tools."github:usestrix/strix"]
version = "1.7.0"
asset_pattern = 'strix-{{ version }}-{{ os(macos="macos", linux="linux") }}-{{ arch(x64="x86_64", arm64="aarch64") }}.tar.gz'

[tools."github:smol-machines/smolvm"]
version = "1.32.4"
asset_pattern = 'smolvm-{{ version }}-{{ os(macos="macos", linux="linux") }}-{{ arch(x64="x86_64", arm64="arm64") }}.tar.gz'

[tools."github:superradcompany/microsandbox"]
version = "0.7.12"
asset_pattern = 'microsandbox-{{ os(macos="macos", linux="linux") }}-{{ arch(x64="x86_64", arm64="arm64") }}.tar.gz'

[tools."github:thomaspeklak/agent-sandbox"]
version = "0.28.0"
asset_pattern = 'ags-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(macos="apple-darwin", linux="unknown-linux-gnu") }}'
bin = "ags"

# npm packages

[tools."npm:command-code"]
version = "latest"
minimum_release_age = "0d"

[tools."npm:cf"]
version = "latest"
minimum_release_age = "0d"

[tools."npm:agent-hop"]
version = "latest"

[tools."npm:@moonmath-ai/zro"]
version = "latest"
minimum_release_age = "0d"

# ---------------------------------------------------------------
# 役割別 zsh 断片（~/.zsh.personal として deploy。ローダが ~/.zsh.* を拾う）
# ---------------------------------------------------------------
[dotfiles]
"~/.zsh.personal" = { source = "zsh/personal", mode = "symlink" }
