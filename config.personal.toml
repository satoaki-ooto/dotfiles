# personal 端末の設定（miserc.local.toml の env = ["personal"] で読まれる）
#
# パッケージは packages/ に 1 パッケージ 1 ファイルで定義してあり、
# 末尾の [dotfiles] で ~/.config/mise/conf.d/ に symlink したものだけが読まれる。
# その一覧が「この端末で使うもの」の明示的な一覧になる。
# （packages/ 以下は conf.d/ に配らない限り読まれない。*.local.toml は gitignored）

[settings]
# paranoid の config カテゴリは外している（パッケージは conf.d/ 方式に移行済みで、
# 有効にしても dotfiles は読める）。有効にするとリポジトリ側の mise 設定が内容単位の
# 承認（mise trust）になり、pull / worktree のたびに止まりうるため、影響を確認してから入れる。
# miserc.local.toml の env で後ろに重ねた設定が paranoid = true を指定すれば、そちらが優先される。
# true は全カテゴリ（config / env_files / plugins / provenance）の指定と同じ。
# provenance（GitHub attestations / SLSA）と plugins / env_files は維持。
paranoid = ["env_files", "plugins", "provenance"]
minimum_release_age = "3d"
disable_tools = ["python", "python3"]
experimental = false
npm.package_manager = "aube"

[env]
OPENSPEC_TELEMETRY = "0"
# aube の typosquat ガード（週 1000 DL 未満は non-interactive で拒否）から
# agent-hop だけ除外する。cf / zro など他のパッケージにはガードを効かせたままにする
AUBE_ALLOWED_UNPOPULAR_PACKAGES = "agent-hop"
# PIG_HOME は config.macos.toml / config.linux.toml で OS ごとに固定する（docs/pig.md 参照）

# ---------------------------------------------------------------
# 役割別 zsh 断片（~/.zsh.personal として deploy。ローダが ~/.zsh.* を拾う）
# ---------------------------------------------------------------
[dotfiles]
"~/.zsh.personal" = { source = "zsh/personal", mode = "symlink" }

# ags（agent-sandbox）。ags 自身も config.toml を書き換える（ags tools / install --add-agent-mounts /
# 初回起動時の自動生成）ため merge で「自分のキー」だけ管理する。
# アセット（Containerfile / image/ / tmux.conf / uv.toml / pi/）は ags install が配るので管理しない
"~/.config/ags/config.toml/core"     = { source = "agents/ags/config.toml", merge = true }
"~/.config/ags/config.toml/defaults" = { source = "agents/ags/config.defaults.toml", merge = "missing" }

# kilo。kilo 自身も /models などで kilo.jsonc を書き換える（jsonc を in-place
# patch するので未管理キー・コメントは保たれる）ため merge で管理する。
# セッション agent のモデル（ask / plan / code / debug）は /models で
# 書き換わるので defaults。それ以外は kilo.jsonc（core）で強制する。
"~/.config/kilo/kilo.jsonc/core"     = { source = "agents/kilo/kilo.jsonc", merge = true }
"~/.config/kilo/kilo.jsonc/defaults" = { source = "agents/kilo/kilo.defaults.jsonc", merge = "missing" }

# ---------------------------------------------------------------
# パッケージ（packages/<name>.toml を ~/.config/mise/conf.d/ に symlink する）
# この一覧が「この端末で使うもの」。conf.d/ は global config として読まれるので、
# paranoid の config カテゴリでも承認なしで読まれる（local include は拒否される）。
# 追加: エントリを足して mise dot apply → mise install（または mise bootstrap）。
# 外す: source を消して mode = "absent" にして mise dot apply
# （エントリを消すだけだと配備済みの symlink が残り、読まれ続ける）
# ---------------------------------------------------------------
"~/.config/mise/conf.d/agent-hop.toml"    = { source = "packages/agent-hop.toml", mode = "symlink" }
"~/.config/mise/conf.d/ags.toml"          = { source = "packages/ags.toml", mode = "symlink" }
"~/.config/mise/conf.d/agy.toml"          = { source = "packages/agy.toml", mode = "symlink" }
"~/.config/mise/conf.d/aube.toml"         = { source = "packages/aube.toml", mode = "symlink" }
"~/.config/mise/conf.d/bun.toml"          = { source = "packages/bun.toml", mode = "symlink" }
"~/.config/mise/conf.d/cf.toml"           = { source = "packages/cf.toml", mode = "symlink" }
"~/.config/mise/conf.d/claude.toml"       = { source = "packages/claude.toml", mode = "symlink" }
"~/.config/mise/conf.d/command-code.toml" = { source = "packages/command-code.toml", mode = "symlink" }
"~/.config/mise/conf.d/gh.toml"           = { source = "packages/gh.toml", mode = "symlink" }
"~/.config/mise/conf.d/go.toml"           = { source = "packages/go.toml", mode = "symlink" }
"~/.config/mise/conf.d/grok.toml"         = { source = "packages/grok.toml", mode = "symlink" }
"~/.config/mise/conf.d/kilo.toml"         = { source = "packages/kilo.toml", mode = "symlink" }
"~/.config/mise/conf.d/node.toml"         = { source = "packages/node.toml", mode = "symlink" }
"~/.config/mise/conf.d/octet.toml"        = { source = "packages/octet.toml", mode = "symlink" }
"~/.config/mise/conf.d/omp.toml"          = { source = "packages/omp.toml", mode = "symlink" }
"~/.config/mise/conf.d/pi.toml"           = { source = "packages/pi.toml", mode = "symlink" }
"~/.config/mise/conf.d/pig.toml"          = { source = "packages/pig.toml", mode = "symlink" }
"~/.config/mise/conf.d/pnpm.toml"         = { source = "packages/pnpm.toml", mode = "symlink" }
"~/.config/mise/conf.d/sops.toml"         = { source = "packages/sops.toml", mode = "symlink" }
"~/.config/mise/conf.d/strix.toml"        = { source = "packages/strix.toml", mode = "symlink" }
"~/.config/mise/conf.d/uv.toml"           = { source = "packages/uv.toml", mode = "symlink" }
"~/.config/mise/conf.d/zig.toml"          = { source = "packages/zig.toml", mode = "symlink" }
"~/.config/mise/conf.d/zls.toml"          = { source = "packages/zls.toml", mode = "symlink" }
"~/.config/mise/conf.d/zro.toml"          = { source = "packages/zro.toml", mode = "symlink" }

# もう一方の役割（personal / work）だけで使うパッケージ。役割を切り替えたときに残らないよう消す
"~/.config/mise/conf.d/microsandbox.toml" = { mode = "absent" }
"~/.config/mise/conf.d/nono.toml"         = { mode = "absent" }
"~/.config/mise/conf.d/rust.toml"         = { mode = "absent" }
