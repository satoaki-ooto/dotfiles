# personal 端末の設定（miserc.local.toml の env = ["personal"] で読まれる）
#
# パッケージは packages/ に 1 パッケージ 1 ファイルで定義してあり、
# この include リストが「この端末で使うもの」の明示的な一覧になる。
# 使わないものは行を削除、追加したいものは行を足すだけ。
# （packages/ 以下は include しない限り読まれない。*.local.toml は gitignored）
#
# 注意: include には [dotfiles] を置けないので、deploy するものはこのファイル直書き。

include = [
  "packages/agent-hop.toml",
  "packages/ags.toml",
  "packages/bun.toml",
  "packages/cf.toml",
  "packages/command-code.toml",
  "packages/go.toml",
  "packages/node.toml",
  "packages/omp.toml",
  "packages/pi.toml",
  "packages/pig.toml",
  "packages/pnpm.toml",
  "packages/smolvm.toml",
  "packages/sops.toml",
  "packages/strix.toml",
  "packages/uv.toml",
  "packages/zig.toml",
  "packages/zls.toml",
  "packages/zro.toml",
]

[settings]
# paranoid の config カテゴリは local include を拒否するため外している。
# true は全カテゴリ（config / env_files / plugins / provenance）の指定と同じ。
# provenance（GitHub attestations / SLSA）と plugins / env_files は維持。
paranoid = ["env_files", "plugins", "provenance"]
minimum_release_age = "3d"
disable_tools = ["python", "python3"]
experimental = false
npm.package_manager = "bun"

[env]
OPENSPEC_TELEMETRY = "0"
# pig の設定 root を固定する。pig は PIG_HOME > XDG_CONFIG_HOME > ~/.pig の順で決めるため、
# XDG_CONFIG_HOME が無い環境（sandbox 等）でも ~/.config/pig を見に行く
PIG_HOME = "${HOME}/.config/pig"

# ---------------------------------------------------------------
# 役割別 zsh 断片（~/.zsh.personal として deploy。ローダが ~/.zsh.* を拾う）
# ---------------------------------------------------------------
[dotfiles]
"~/.zsh.personal" = { source = "zsh/personal", mode = "symlink" }
