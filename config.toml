# 実体: このリポジトリ（~/.config/mise はここへの symlink）
# 適用: mise bootstrap --dry-run → mise bootstrap
# 新端末: mise bootstrap --adopt satoaki-ooto/dotfiles

[tools]
# 共通で入れるツールはここへ（node は config.personal.toml 側で定義）

# ---------------------------------------------------------------
# システムパッケージ（パッケージマネージャが無い端末ではスキップ）
# ---------------------------------------------------------------
[bootstrap.packages]
"brew:zsh" = { os = "macos" }
"apt:zsh" = "latest"

# ---------------------------------------------------------------
# Git リポジトリ（新端末で bootstrap が clone する）
# ---------------------------------------------------------------
[bootstrap.repos]
# prezto 本体。更新は `mise bootstrap repos update`
"~/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git", submodules = true, depth = 1 }

# ---------------------------------------------------------------
# dotfiles の deploy
# 相対 source は config.toml のある場所（= repo ルート）基準
# 「自分で管理するもの」と「prezto が管理するもの」を分けて宣言する。
# 基本は symlink なので、実体を更新すれば次のシェルから反映される。
# ---------------------------------------------------------------
[dotfiles]
# --- 自分で管理するもの（このリポジトリの実体） ---
"~/.zshrc"    = { source = "zsh/zshrc", mode = "symlink" }
"~/.zsh"      = { source = "zsh/lib", mode = "symlink" }
"~/.zpreztorc" = { source = "zsh/zpreztorc", mode = "symlink" }
"~/.zshenv"   = { source = "zsh/zshenv", mode = "symlink" }

# --- prezto が管理するもの（~/.zprezto/runcoms の実体） ---
# repos の clone 後に配備される。prezto を update すれば symlink 先も更新される。
# ~/.zshrc / ~/.zpreztorc / ~/.zshenv は上の自前版を使うため対象外。
"~/.zlogin"  = { source = "~/.zprezto/runcoms/zlogin", mode = "symlink" }
"~/.zlogout" = { source = "~/.zprezto/runcoms/zlogout", mode = "symlink" }

# ~/.zprofile は mise の shell activation が書くため symlink できない。
# 代わりに prezto の zprofile を source するブロックを足し、内容だけ取り込む。
"~/.zprofile/prezto" = { block = '[[ -s "${ZDOTDIR:-$HOME}/.zprezto/runcoms/zprofile" ]] && source "${ZDOTDIR:-$HOME}/.zprezto/runcoms/zprofile"' }

# ---------------------------------------------------------------
# コーディングエージェント
# 実体: agents/<agent>/。共通の指示（AGENTS.md / rules/）は agents/shared/ に置き、
# 各エージェントから参照する（AGENTS.md は「全エージェントで共通」という位置づけ）
# ---------------------------------------------------------------

# pi: ~/.pi/agent。pig: ~/.config/pig/agent（PIG_HOME で固定。docs/config.md 参照）
# アプリが書き換える settings.json は merge で「自分のキー」だけ管理する:
#   - core: 強制するキー（リポジトリが唯一の情報源。pi install したものは
#     ここに書いてから bootstrap すると全機械に反映される）
#   - defaults: 既定値だけ配るキー（/model で選んだ値はアプリの所有物。無いときだけ埋める）
"~/.pi/agent/settings.json/core"          = { source = "agents/pi/settings.json.tera", merge = true, template = "tera" }
"~/.pi/agent/settings.json/defaults"      = { source = "agents/pi/settings.defaults.json", merge = "missing" }
"~/.config/pig/agent/settings.json/core"     = { source = "agents/pig/settings.json", merge = true }
"~/.config/pig/agent/settings.json/defaults" = { source = "agents/pig/settings.defaults.json", merge = "missing" }
"~/.omp/agent/config.yml/core"            = { source = "agents/omp/config.yml", merge = true }
"~/.omp/agent/config.yml/defaults"        = { source = "agents/omp/config.defaults.yml", merge = "missing" }

# アプリが書き換えないものは copy（実ファイル）として配る。
# symlink だと sandbox 内で ~/.config/mise が見えず設定を読めず error になるため。
# 編集は agents/ 側で行い mise dot apply で反映する（ターゲット側を編集すると次の apply で上書きされる。
# 取り込みたいときは mise dot add <ターゲット> で source に反映できる）
"~/.pi/agent/models.json"          = { source = "agents/pi/models.json", mode = "copy" }
"~/.pi/agent/AGENTS.md"            = { source = "agents/shared/AGENTS.md", mode = "copy" }
"~/.pi/agent/rules"                = { source = "agents/shared/rules", mode = "copy" }
# ~/.pi/agent/extensions/ は拡張の自動検出対象。settings.json への追記は不要
"~/.pi/agent/extensions/guard-git-push.ts" = { source = "agents/pi/extensions/guard-git-push.ts", mode = "copy" }
"~/.config/pig/agent/models.json"  = { source = "agents/pig/models.json", mode = "copy" }
"~/.config/pig/agent/AGENTS.md"    = { source = "agents/shared/AGENTS.md", mode = "copy" }
"~/.config/pig/agent/rules"        = { source = "agents/shared/rules", mode = "copy" }
"~/.omp/agent/models.yml"          = { source = "agents/omp/models.yml", mode = "copy" }
"~/.omp/agent/AGENTS.md"           = { source = "agents/shared/AGENTS.md", mode = "copy" }
"~/.omp/agent/rules"               = { source = "agents/shared/rules", mode = "copy" }

# octet: ~/.octet/config.toml / credentials/ はアプリが管理する（config.toml.lock 付き）ので対象外。
# AGENTS.md と rules だけ copy する。
"~/.octet/AGENTS.md" = { source = "agents/shared/AGENTS.md", mode = "copy" }
"~/.octet/rules"     = { source = "agents/shared/rules", mode = "copy" }

# pig は models.json だけを読む（models.jsonc は未参照のため無効）。
# models.jsonc は誤認のもとになるので配備時に消す（内容は agents/pig/models.json に移行済み）
"~/.config/pig/agent/models.jsonc" = { mode = "absent" }

# ---------------------------------------------------------------
# シェルへの mise 組み込み
# zprofile 自体は mise が管理する（dotfiles は prezto の source ブロックだけ追加する）。
# 対話シェルは zshrc 側の eval "$(mise activate zsh)" で有効になる。
# ---------------------------------------------------------------
[bootstrap.mise_shell_activate]
zprofile = "shims"

# ログインシェル
[bootstrap.user]
login_shell = "zsh"

# ---------------------------------------------------------------
# ファイルだけでは表現できないセットアップ（冪等に。毎回走る）
# ---------------------------------------------------------------
# [tasks.bootstrap]
# run = "install -d -m 700 ~/.ssh"
