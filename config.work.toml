# 会社PC向けモジュール
# 会社PCの ~/.config/mise/miserc.local.toml に env = ["work"] を書くと読み込まれる
#
# 注意: このリポジトリは public。社内固有のパッケージ名・URL・社内ツール名を
# 書いてよいかは別途判断すること（ダメならリポジトリを private にするか、
# config.work.local.toml に書いて追跡対象外にする）
#
# パッケージは packages/ の定義を include して初めて有効になる
# （自動では読まれない）。使うものだけ明示する。
include = [
  "packages/ags.toml",
  "packages/bun.toml",
  "packages/command-code.toml",
  "packages/microsandbox.toml",
  "packages/node.toml",
  "packages/nono.toml",
  "packages/omp.toml",
  "packages/pi.toml",
  "packages/pig.toml",
  "packages/rust.toml",
  "packages/uv.toml",
]

[tools]
# kubectl = "latest"

[bootstrap.packages]
# "brew:awscli" = { os = "macos" }

# ---------------------------------------------------------------
# 役割別 zsh 断片（~/.zsh.work として deploy。ローダが ~/.zsh.* を拾う）
# ---------------------------------------------------------------
[dotfiles]
"~/.zsh.work" = { source = "zsh/work", mode = "symlink" }
