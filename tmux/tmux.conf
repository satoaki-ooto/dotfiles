# basic setting
# escape
set -s escape-time 600

#set -g default-terminal screen-256color
#set -g terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g allow-rename off
set -g default-shell "/bin/zsh"
#set -g default-shell "/usr/bin/zsh"
#set -g default-shell "/usr/bin/fish"

# prefix unbind C-b
unbind C-b

# prefix change C-Space
set -g prefix C-t

# キーストロークのディレイを減らす
set -sg escape-time 1

# Set Windows Index 1
set -g base-index 1

# Set Pane Index 1
setw -g pane-base-index 1

# Ctrl-a r setting reload
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 2tiimes C-a, send C-a Programming
# bind C-a send-prefix

# horizon split pane, Use C-a v
bind v split-window -h
bind 3 split-window -h

# vertical split pane, Use C-a s
unbind s
bind m split-window -v
bind 2 split-window -v

# Pane Move(Use Vim Keybind)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p previous-window
bind n next-window
bind S swap-pane -s '{top-left}'

# Window Move
unbind <
unbind >
bind -r < if-shell -F '#{window_start_flag}' '' 'swap-window -d -t -1'
bind -r > if-shell -F '#{window_end_flag}' '' 'swap-window -d -t +1'

## use vi keybind
setw -g mode-keys vi
bind -T copy-mode-vi ^ send -X start-of-line
bind -T copy-mode-vi '$' send -X end-of-line
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi e send -X next-word-end
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi C-n send -X page-up
bind -T copy-mode-vi C-f send -X page-down
bind -T copy-mode-vi C-u send -X scroll-up
bind -T copy-mode-vi C-d send -X scroll-down

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'V' send -X select-line

# Enter and mouse draggin copy and paste
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
# yank
if "which xclip" "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -i -sel clip > /dev/null'"
if "which xsel" "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xsel -bi'"
if "which pbcopy" "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'"
if "which win32yank.exe" "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'cat | win32yank.exe -i'"

if "which xclip" "bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -i -sel clip > /dev/null'"
if "which xsel" "bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xsel -bi'"
if "which pbcopy" "bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'"
if "which win32yank.exe" "bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'cat | win32yank.exe -i'"

if "which xclip" "bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -i -sel clip > /dev/null'"
if "which xsel" "bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xsel -bi'"
if "which pbcopy" "bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'"
if "which win32yank.exe" "bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'cat | win32yank.exe -i'"

# history limit 100000
set -g history-limit 100000

# mouse enable
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# synchronize pane
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# extended-keys (extended-keys-format requires tmux 3.5+)
set -g extended-keys on
if-shell 'printf "%s\n" "#{version}" | awk "{ sub(/^[^0-9]*/, \"\"); sub(/[^0-9.].*/, \"\"); split(\$0, v, \".\"); exit !(v[1]*100 + v[2] >= 305) }"' 'set -g extended-keys-format csi-u'

# === catppuccin/tmux v2 status bar ===
# v2ではAPIが大きく変わっているため、v1の旧キーは使わない。
# 主な変更点 (https://github.com/catppuccin/tmux/issues/291):
#  - @catppuccin_status_modules_{left,right} は廃止 → status-right を自前で組み立てる
#  - @catppuccin_window_*_fill は廃止 → @catppuccin_window_status_style で指定
#  - @catppuccin_window_default_text → @catppuccin_window_text にリネーム
#  - 起動に `run ~/.tmux/plugins/tmux/catppuccin.tmux` の明示呼び出しが必要

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, none

# window モジュール
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# directory モジュール (status-rightで参照する場合に使用)
set -g @catppuccin_directory_text "#{pane_current_path}"

# randomにwindow nameを自動的に変える
set-hook -g after-new-window 'run-shell "tmux rename-window -t #{window_id} w-$(openssl rand -hex 173 | cut -c 19-24)"'

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# catppuccin v2 本体を明示的に起動 (TPMの run より前に呼ぶ)
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# status-line を自前で組み立てる (v2では status_modules_right が廃止)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"

# set tmux-floax
set -g @floax-text-color 'white'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'blue'
set -g @floax-title 'floax'
set -g @floax-session-name 'float'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
